[project]
name = "appa2"
requires-python = ">=3.11,<3.12"
version = "0.0.1"
dependencies = [
  "bottleneck==1.4.0",
  "dask==2024.6.2",
  "cloudpickle",
  "pandas",
  "einops==0.8.0",
  "gcsfs==2025.5.1",
  "heavyball==1.4.3",
  "hydra-core==1.3.2",
  "h5py==3.12.1",
  "numcodecs==0.16.1",
  "numpy==1.26.3",
  "scipy==1.14.1",
  "torch==2.5.1; platform_system != 'Linux' or platform_machine != 'aarch64'",
  "torch==2.6.0; platform_system == 'Linux' and platform_machine == 'aarch64'",
  "tqdm==4.66.4",
  "xarray==2025.9.0",
  "zarr==3.1.2",
]

[project.optional-dependencies]
dev = [
  "cmocean==4.0.3",
  "jupyterlab==4.2.2",
  "ipykernel==6.29.5",
  "matplotlib==3.9.0",
  "pre-commit==3.7.1",
  "pytest==8.2.2",
  "ruff==0.4.8",
]

gpu = [
  "xformers==0.0.28.post3; platform_system == 'Linux' and platform_machine == 'x86_64'",
  "dawgz==1.0.4",
  "wandb==0.17.1",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.ruff]
extend-include = ["*.ipynb"]
line-length = 99

[tool.ruff.lint]
extend-select = ["B", "I", "W"]
ignore = ["E731", "E741"]

[tool.ruff.lint.isort]
lines-between-types = 1
relative-imports-order = "closest-to-furthest"
section-order = ["future", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
preview = true

[tool.setuptools.packages.find]
include = ["appa2", "appa2.*"]
