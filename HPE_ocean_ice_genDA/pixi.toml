[workspace]
channels = ["https://conda.anaconda.org/conda-forge"]
name = "appa2"
platforms = ["osx-arm64", "linux-64", { name = "linux-castner", platform = "linux-aarch64", cuda = "12.6" }]
requires-pixi = ">=0.83"
version = "0.1.0"

[tasks]

[dependencies]
python = "3.11.*"
pip = "*"

[feature.mac-dev]
# All platforms permit host-side PyPI metadata builds when locking elsewhere.
platforms = ["osx-arm64", "linux-castner", "linux-64"]

[feature.mac-dev.pypi-dependencies]
appa2 = { path = ".", editable = true, extras = ["dev"] }

# Pin the CUDA-enabled ARM wheel explicitly; PyPI ARM wheels may be CPU-only.
[feature.mac-dev.target.linux-aarch64.pypi-dependencies]
torch = { url = "https://download.pytorch.org/whl/cu126/torch-2.6.0%2Bcu126-cp311-cp311-linux_aarch64.whl" }

[feature.gpu-dev-castner]
# Castner: Grace ARM CPU + Hopper GH200 GPU; CUDA 12.6 runtime.
platforms = ["osx-arm64", "linux-castner", "linux-64"]

[feature.gpu-dev-castner.target.osx-arm64.pypi-dependencies]
appa2 = { path = ".", editable = true, extras = ["dev"] }

[feature.gpu-dev-castner.target.linux-aarch64.pypi-dependencies]
torch = { url = "https://download.pytorch.org/whl/cu126/torch-2.6.0%2Bcu126-cp311-cp311-linux_aarch64.whl" }
appa2 = { path = ".", editable = true, extras = ["dev", "gpu"] }

[environments]
mac-dev = ["mac-dev"]
gpu-dev-castner = ["gpu-dev-castner"]
gpu-dev-protage = ["gpu-dev-protage"]

[feature.mac-dev.target.linux-64.pypi-dependencies]
torch = { url = "https://download.pytorch.org/whl/rocm6.4/torch-2.9.1%2Brocm6.4-cp311-cp311-manylinux_2_28_x86_64.whl" }
pytorch-triton-rocm = { url = "https://download.pytorch.org/whl/pytorch_triton_rocm-3.5.1-cp311-cp311-linux_x86_64.whl" }

[feature.gpu-dev-castner.target.linux-64.pypi-dependencies]
torch = { url = "https://download.pytorch.org/whl/rocm6.4/torch-2.9.1%2Brocm6.4-cp311-cp311-manylinux_2_28_x86_64.whl" }
pytorch-triton-rocm = { url = "https://download.pytorch.org/whl/pytorch_triton_rocm-3.5.1-cp311-cp311-linux_x86_64.whl" }
appa2 = { path = ".", editable = true, extras = ["dev", "gpu"] }

[feature.gpu-dev-protage]
# Protage: x86-64 + MI300A (gfx942); use the site's rocm/6.4.1 module.
platforms = ["osx-arm64", "linux-castner", "linux-64"]

[feature.gpu-dev-protage.target.osx-arm64.pypi-dependencies]
appa2 = { path = ".", editable = true, extras = ["dev"] }

[feature.gpu-dev-protage.target.linux-aarch64.pypi-dependencies]
torch = { url = "https://download.pytorch.org/whl/cu126/torch-2.6.0%2Bcu126-cp311-cp311-linux_aarch64.whl" }
appa2 = { path = ".", editable = true, extras = ["dev", "gpu"] }

[feature.gpu-dev-protage.target.linux-64.pypi-dependencies]
torch = { url = "https://download.pytorch.org/whl/rocm6.4/torch-2.9.1%2Brocm6.4-cp311-cp311-manylinux_2_28_x86_64.whl" }
pytorch-triton-rocm = { url = "https://download.pytorch.org/whl/pytorch_triton_rocm-3.5.1-cp311-cp311-linux_x86_64.whl" }
appa2 = { path = ".", editable = true, extras = ["dev", "gpu"] }
